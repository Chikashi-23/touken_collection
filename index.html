<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とうけん</title>

<!-- ホーム画面に追加したときの名前とアイコン -->
<meta name="apple-mobile-web-app-title" content="とうけん">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<!-- ホーム画面から開いたときにアプリのように全画面で表示し、上部の時計などを墨色の上に重ねる -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E1E24">

<style>
  html, body { margin: 0; height: 100%; background: #1E1E24; color-scheme: dark; }
  body {
    box-sizing: border-box;
    /* iPhoneのノッチやホームバーに中身が隠れないようにする */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    position: relative;
  }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #B3A894; font: 500 15px/1.6 "Hiragino Mincho ProN", "Yu Mincho", serif; letter-spacing: .1em;
  }
  iframe {
    position: relative; display: block; border: 0; width: 100%; height: 100%;
    background: transparent;
  }
</style>
</head>
<body>
<!-- 読み込みが終わるまでの表示（アプリが表示されると隠れます） -->
<div class="loading" aria-hidden="true">読み込み中…</div>

<!-- ▼ GASのウェブアプリURL（/exec で終わるもの）に書き換える -->
<iframe src="https://script.google.com/a/macros/systena.co.jp/s/AKfycbyZrDE-UJlUOHYaYAcxq4dJiTSeqa2yNT8dFOOjIu3wON0sMcuC0Zv4mrVlv-WujkD8/exec" title="とうけん"></iframe>
</body>
</html>
